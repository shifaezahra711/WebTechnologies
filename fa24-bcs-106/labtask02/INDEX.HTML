<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Shop</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>


<nav class="navbar navbar-expand-md navbar-dark bg-dark">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand" href="#">ShopEase</a>

        <!-- Hamburger -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>

            </ul>

            <!-- Cart -->
            <a href="#" class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>

        </div>

    </div>

</nav>


<!-- Products -->
<main class="container py-4">

    <h1 class="text-center mb-4">Our Products</h1>

    <section class="row g-4">

        <!-- Product 1 -->
        <article class="col-12 col-md-6 col-lg-3">

            <div class="product">
                <img src="Product 1.jpg" alt="Product 1">

                <h2>Prayer Mat</h2>

                <p>Rs. 1,500</p>
            </div>

        </article>


        <!-- Product 2 -->
        <article class="col-12 col-md-6 col-lg-3">

            <div class="product">
                <img src="product 2.jpg" alt="Product 2">

                <h2>Prayer Set</h2>

                <p>Rs. 2,000</p>
            </div>

        </article>


        <!-- Product 3 -->
        <article class="col-12 col-md-6 col-lg-3">

            <div class="product">
                <img src="product 3.jpg" alt="Product 3">

                <h2>Custom Prayer Mat</h2>

                <p>Rs. 2,500</p>
            </div>

        </article>


        <!-- Product 4 -->
        <article class="col-12 col-md-6 col-lg-3">

            <div class="product">
                <img src="product 4.jpg" alt="Product 4">

                <h2>Prayer Set 2</h2>

                <p>Rs. 3,000</p>
            </div>

        </article>

    </section>

</main>




</body>
</html>
